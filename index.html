<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTA Boss HP Tracker</title>
<style>
* {
    box-sizing: border-box;
}

html, body {
    touch-action: manipulation;
}
body {
    font-family: Arial, sans-serif;
    background: #222;
    color: white;
    width: 100%;
    max-width: 520px;
    padding: 10px;
    margin: 40px auto;
}
h1 { text-align: center; }
select, input, button {
    font-size: 18px;
    padding: 9px;
    margin: 4px;
}
select { width: 100%; }
input { width: 230px; }
button { cursor: pointer; }
.hp {
    font-size: 32px;
    text-align: center;
    margin: 20px 0;
}
.bar {
    width: 100%;
    height: 30px;
    background: #555;
    margin-bottom: 15px;
    border-radius: 5px;
    overflow: hidden;
}
.bar-inner {
    height: 100%;
    background: #4caf50;
    width: 100%;
    transition: width 0.2s;
}
.center { text-align: center; }
.panel, .history-panel {
    background: #333;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}
.history-panel h2 { text-align: center; margin-top: 0; }
.history-item {
    background: #444;
    padding: 7px;
    margin: 4px 0;
    border-radius: 4px;
}
#totalDamage {
    font-size: 20px;
    margin: 10px 0;
}
.dead {
    color: #ff4444;
    font-weight: bold;
    font-size: 24px;
}
.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
}
.keypad button {
    height: 60px;
    font-size: 28px;
    margin: 0;
}
.damage-button {
    width: calc(50% - 8px);
    height: 60px;
    font-size: 22px;
    margin-top: 10px;
}
.manage-button {
    width: 100%;
    margin-top: 15px;
}
.small {
    font-size: 14px;
    color: #bbb;
}
/* ダメージ適用 */
.damage-button {
    background: #d96b6b;
    color: white;
    border: none;
}

/* 回復 */
.heal-button {
    background: #6bbf7b;
    color: white;
    border: none;
}

/* C・←ボタン */
.keypad .clear-button,
.keypad .back-button {
    background: #5f5f5f;
    color: white;
    border: none;
}
.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
    touch-action: manipulation;
}

.keypad button {
    height: 60px;
    font-size: 28px;
    margin: 0;
    touch-action: manipulation;
}

.history-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

.history-buttons button {
    min-width: 120px;
}

.reset-area {
    margin-top: 30px;
    text-align: center;
}

.reset-button {
    background: #555;
    color: white;
    border: none;
    padding: 8px 20px;
}


.zoom-controls {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(34, 34, 34, 0.95);
    padding: 4px;
    border-radius: 6px;
}

.zoom-controls button {
    width: 42px;
    height: 42px;
    padding: 0;
    margin: 0;
    font-size: 24px;
    line-height: 1;
}

#zoomText {
    min-width: 56px;
    text-align: center;
    font-size: 16px;
}


/* ダメージ入力の上下キーを非表示 */
#damage::-webkit-outer-spin-button,
#damage::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

#damage {
    -moz-appearance: textfield;
}

</style>
</head>
<body>

<div class="zoom-controls">
    <button type="button" onclick="changeZoom(-0.1)">−</button>
    <span id="zoomText">100%</span>
    <button type="button" onclick="changeZoom(0.1)">＋</button>
</div>

<div id="app">

<h1>RTA Boss HP Tracker</h1>

<div class="center">
    <select id="bossSelect"></select>

    <div class="hp">
        <span id="currentHP">0</span> /
        <span id="maxHP">0</span>
    </div>

    <div class="bar">
        <div class="bar-inner" id="hpBar"></div>
    </div>

    <input type="number" inputmode="numeric" id="damage" placeholder="ダメージ">

    <div class="keypad">
        <button type="button" onclick="keypadInput('1')">1</button>
        <button type="button" onclick="keypadInput('2')">2</button>
        <button type="button" onclick="keypadInput('3')">3</button>
        <button type="button" onclick="keypadInput('4')">4</button>
        <button type="button" onclick="keypadInput('5')">5</button>
        <button type="button" onclick="keypadInput('6')">6</button>
        <button type="button" onclick="keypadInput('7')">7</button>
        <button type="button" onclick="keypadInput('8')">8</button>
        <button type="button" onclick="keypadInput('9')">9</button>
        <button type="button" class="back-button" onclick="keypadBackspace()">←</button>
        <button type="button" onclick="keypadInput('0')">0</button>
        <button type="button" class="clear-button" onclick="keypadClear()">C</button>
    </div>

    <button class="damage-button" onclick="applyDamage()">ダメージ適用</button>
    <button class="heal-button" onclick="applyHeal()">回復</button>

    <div class="history-buttons">
        <button onclick="undoDamage()">↩ Undo</button>
        <button onclick="redoDamage()">Redo ↪</button>
    </div>

    <div class="reset-area">
        <button class="reset-button" onclick="resetHP()">リセット</button>
    </div>

    <div id="status"></div>
</div>

<div id="totalDamage">累計ダメージ：0</div>

<div class="history-panel">
    <h2>ダメージ履歴</h2>
    <div id="damageHistory">まだダメージ履歴がありません</div>
</div>

<div class="panel">
    <button class="manage-button" onclick="location.href='bosses.html'">ボス管理</button>
</div>

</div>

<script>
let bosses = JSON.parse(localStorage.getItem("bosses")) || {};
let selectedBoss = localStorage.getItem("selectedBoss") || "";

let maxHP = 0;
let currentHP = 0;
let hpHistory = [];
let damageHistory = [];
let redoHistory = [];

const bossSelect = document.getElementById("bossSelect");
const damageInput = document.getElementById("damage");
const currentHPText = document.getElementById("currentHP");
const maxHPText = document.getElementById("maxHP");
const hpBar = document.getElementById("hpBar");
const status = document.getElementById("status");

let audioContext = null;

function playKeySound() {
    try {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(700, audioContext.currentTime);

        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.05
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.05);
    } catch (e) {
        console.warn("音声を再生できませんでした:", e);
    }
}

function keypadInput(number) {
    damageInput.value += number;
    playKeySound();
}

function keypadBackspace() {
    damageInput.value = damageInput.value.slice(0, -1);
    playKeySound();
}

function keypadClear() {
    damageInput.value = "";
    playKeySound();
}

function updateBossList() {
    bossSelect.innerHTML = "";

    for (const name in bosses) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name + "（HP " + Number(bosses[name]).toLocaleString() + "）";
        bossSelect.appendChild(option);
    }

    if (selectedBoss && bosses[selectedBoss]) {
        bossSelect.value = selectedBoss;
    } else if (bossSelect.options.length > 0) {
        selectedBoss = bossSelect.options[0].value;
        bossSelect.value = selectedBoss;
    }
}

function selectBoss() {
    const name = bossSelect.value;
    selectedBoss = name;
    localStorage.setItem("selectedBoss", name);

    hpHistory = [];
    damageHistory = [];
    redoHistory = [];

    if (!name || !bosses[name]) {
        maxHP = 0;
        currentHP = 0;
        updateDisplay();
        updateDamageHistory();
        return;
    }

    maxHP = Number(bosses[name]);
    currentHP = maxHP;

    updateDisplay();
    updateDamageHistory();
}

bossSelect.addEventListener("change", selectBoss);

function applyDamage() {
    const damage = Number(damageInput.value);
    if (!damage || damage <= 0 || maxHP <= 0) return;

    const previousHP = currentHP;
    const newHP = Math.max(0, currentHP - damage);

    hpHistory.push(previousHP);
    damageHistory.push({ type: "damage", value: damage });
    redoHistory = [];

    currentHP = newHP;
    damageInput.value = "";

    updateDisplay();
    updateDamageHistory();
}

function applyHeal() {
    const heal = Number(damageInput.value);
    if (!heal || heal <= 0 || maxHP <= 0) return;

    const previousHP = currentHP;
    const newHP = Math.min(maxHP, currentHP + heal);

    hpHistory.push(previousHP);
    damageHistory.push({ type: "heal", value: heal });
    redoHistory = [];

    currentHP = newHP;
    damageInput.value = "";

    updateDisplay();
    updateDamageHistory();
}

function undoDamage() {
    if (hpHistory.length === 0 || damageHistory.length === 0) return;

    const previousHP = hpHistory.pop();
    const action = damageHistory.pop();

    redoHistory.push({
        previousHP: previousHP,
        newHP: currentHP,
        action: action
    });

    currentHP = previousHP;

    updateDisplay();
    updateDamageHistory();
}

function redoDamage() {
    if (redoHistory.length === 0) return;

    const item = redoHistory.pop();

    hpHistory.push(item.previousHP);
    damageHistory.push(item.action);
    currentHP = item.newHP;

    updateDisplay();
    updateDamageHistory();
}

function resetHP() {

    if (!confirm("HPをリセットしますか？")) {
        return;
    }

    currentHP = maxHP;
    hpHistory = [];
    damageHistory = [];
    redoHistory = [];

    updateDisplay();
    updateDamageHistory();
}

function updateDisplay() {
    currentHPText.textContent = currentHP.toLocaleString();
    maxHPText.textContent = maxHP.toLocaleString();

    const percent = maxHP > 0 ? (currentHP / maxHP) * 100 : 0;
    hpBar.style.width = percent + "%";

    if (currentHP <= 0 && maxHP > 0) {
        status.innerHTML = '<span class="dead">DEAD!</span>';
    } else if (maxHP > 0) {
        status.textContent = "残り " + percent.toFixed(2) + "%";
    } else {
        status.textContent = "ボスを追加してください";
    }
}

function updateDamageHistory() {
    const history = document.getElementById("damageHistory");

    const totalDamage = damageHistory.reduce((sum, item) => {
        return item.type === "damage" ? sum + item.value : sum;
    }, 0);

    document.getElementById("totalDamage").textContent =
        "累計ダメージ：" + totalDamage.toLocaleString();

    if (damageHistory.length === 0) {
        history.innerHTML = "まだダメージ履歴がありません";
        return;
    }

    history.innerHTML = "";

    [...damageHistory].reverse().forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "history-item";

        if (item.type === "damage") {
            div.textContent = (index + 1) + ".  -" + item.value.toLocaleString();
        } else {
            div.textContent = (index + 1) + ".  +" + item.value.toLocaleString() + " 回復";
        }

        history.appendChild(div);
    });
}

damageInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        applyDamage();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.target === damageInput) return;

    if (event.key === "ArrowLeft") {
        event.preventDefault();
        undoDamage();
    }
});


let pageZoom = Number(localStorage.getItem("pageZoom"));

if (!pageZoom || pageZoom < 0.5 || pageZoom > 1.5) {
    pageZoom = 1;
}

function applyZoom() {
    const app = document.getElementById("app");
    const zoomText = document.getElementById("zoomText");

    app.style.zoom = pageZoom;
    zoomText.textContent = Math.round(pageZoom * 100) + "%";
}

function changeZoom(amount) {
    pageZoom = Math.round((pageZoom + amount) * 10) / 10;
    pageZoom = Math.max(0.5, Math.min(1.5, pageZoom));

    localStorage.setItem("pageZoom", pageZoom);
    applyZoom();
}

applyZoom();

updateBossList();

if (bossSelect.options.length > 0) {
    selectBoss();
} else {
    updateDisplay();
}
</script>
</body>
</html>
